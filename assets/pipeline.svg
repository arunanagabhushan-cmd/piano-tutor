<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 410" width="1100" height="410" font-family="Helvetica, Arial, sans-serif">
  <title>Figure 2. The scoring pipeline</title>
  <desc>A student recording and the teacher's reference recording are each transcribed and cleaned. Phrase boundaries come from the teacher's notes only; the student is anchored by one constant shift and matched by longest common subsequence, without time-warping. Each phrase is scored at the tier the teacher set, and the output is a per-phrase score vector with no composite score.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#15171c"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b0243b"/>
    </marker>
  </defs>
  <rect width="1100" height="410" fill="#ffffff"/>

  <!-- column headers -->
  <g font-size="11" font-weight="700" fill="#5a6070" letter-spacing="1.2" text-anchor="middle">
    <text x="90"  y="34">INPUT</text>
    <text x="260" y="34">TRANSCRIBE</text>
    <text x="430" y="34">CLEAN</text>
    <text x="620" y="34">SEGMENT &amp; ALIGN</text>
    <text x="825" y="34">SCORE</text>
    <text x="1012" y="34">OUTPUT</text>
  </g>

  <!-- row 1: student -->
  <g>
    <rect x="20" y="70" width="140" height="60" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
    <text x="90" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#15171c">Student</text>
    <text x="90" y="114" text-anchor="middle" font-size="12" fill="#5a6070">practice recording</text>

    <rect x="195" y="70" width="130" height="60" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
    <text x="260" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#15171c">Transcribe</text>
    <text x="260" y="114" text-anchor="middle" font-size="12" fill="#5a6070">audio → notes</text>

    <rect x="360" y="70" width="140" height="60" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
    <text x="430" y="96" text-anchor="middle" font-size="14" font-weight="700" fill="#15171c">Clean</text>
    <text x="430" y="114" text-anchor="middle" font-size="12" fill="#5a6070">remove artifacts</text>
  </g>

  <!-- row 2: teacher -->
  <g>
    <rect x="20" y="200" width="140" height="60" rx="6" fill="#ffffff" stroke="#b0243b" stroke-width="2"/>
    <text x="90" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#b0243b">Teacher</text>
    <text x="90" y="244" text-anchor="middle" font-size="12" fill="#5a6070">reference recording</text>

    <rect x="195" y="200" width="130" height="60" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
    <text x="260" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#15171c">Transcribe</text>
    <text x="260" y="244" text-anchor="middle" font-size="12" fill="#5a6070">audio → notes</text>

    <rect x="360" y="200" width="140" height="60" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
    <text x="430" y="226" text-anchor="middle" font-size="14" font-weight="700" fill="#15171c">Clean</text>
    <text x="430" y="244" text-anchor="middle" font-size="12" fill="#5a6070">same filters, both sides</text>
  </g>

  <!-- row arrows -->
  <g stroke="#15171c" stroke-width="1.6" fill="none" marker-end="url(#arr)">
    <line x1="160" y1="100" x2="193" y2="100"/>
    <line x1="325" y1="100" x2="358" y2="100"/>
    <line x1="500" y1="100" x2="533" y2="100"/>
    <line x1="160" y1="230" x2="193" y2="230"/>
    <line x1="325" y1="230" x2="358" y2="230"/>
    <line x1="500" y1="230" x2="533" y2="230"/>
  </g>

  <!-- segment & align -->
  <rect x="535" y="55" width="170" height="220" rx="8" fill="#f4f5f7" stroke="#15171c" stroke-width="1.5"/>
  <g font-size="12.5" fill="#15171c">
    <text x="551" y="84" font-weight="700" font-size="14">Segment &amp; align</text>
    <text x="551" y="112">• phrases from the</text>
    <text x="563" y="128"><tspan fill="#b0243b" font-weight="700">teacher's</tspan> notes only</text>
    <text x="551" y="152">• one constant shift</text>
    <text x="563" y="168">anchors the student</text>
    <text x="551" y="192">• no time-warping</text>
    <text x="551" y="216">• windows follow the</text>
    <text x="563" y="232">student's own tempo</text>
    <text x="551" y="256">• LCS note matching</text>
  </g>

  <!-- arrow to score -->
  <line x1="705" y1="165" x2="738" y2="165" stroke="#15171c" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- tier input -->
  <text x="825" y="50" text-anchor="middle" font-size="11.5" font-weight="700" fill="#b0243b">tier k, set by the teacher</text>
  <line x1="825" y1="55" x2="825" y2="70" stroke="#b0243b" stroke-width="1.6" marker-end="url(#arrA)"/>

  <!-- score box with tier ladder -->
  <rect x="740" y="72" width="170" height="203" rx="8" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
  <text x="756" y="97" font-size="14" font-weight="700" fill="#15171c">Score each phrase</text>
  <g font-size="12">
    <rect x="752" y="110" width="146" height="30" rx="4" fill="#15171c"/>
    <text x="762" y="130" fill="#ffffff" font-weight="700">1</text><text x="778" y="130" fill="#ffffff">right notes</text>
    <rect x="752" y="145" width="146" height="30" rx="4" fill="#3a3e48"/>
    <text x="762" y="165" fill="#ffffff" font-weight="700">2</text><text x="778" y="165" fill="#ffffff">+ right order</text>
    <rect x="752" y="180" width="146" height="44" rx="4" fill="#ffffff" stroke="#8a90a0" stroke-dasharray="4 3"/>
    <text x="762" y="198" fill="#5a6070" font-weight="700">3</text><text x="778" y="198" fill="#5a6070">+ even, speed,</text>
    <text x="778" y="214" fill="#5a6070">note length</text>
    <rect x="752" y="229" width="146" height="30" rx="4" fill="#ffffff" stroke="#8a90a0" stroke-dasharray="4 3"/>
    <text x="762" y="249" fill="#5a6070" font-weight="700">4</text><text x="778" y="249" fill="#5a6070">+ loud and soft</text>
  </g>

  <!-- arrow to output -->
  <line x1="910" y1="165" x2="943" y2="165" stroke="#15171c" stroke-width="1.6" marker-end="url(#arr)"/>

  <!-- output -->
  <rect x="945" y="72" width="140" height="203" rx="8" fill="#ffffff" stroke="#15171c" stroke-width="1.5"/>
  <text x="959" y="97" font-size="14" font-weight="700" fill="#15171c">Score vector</text>
  <g font-family="Menlo, Consolas, 'Courier New', monospace" font-size="11" fill="#15171c">
    <text x="959" y="124">phrase 1</text>
    <text x="967" y="140">pitch  0.91</text>
    <text x="967" y="156">order  0.84</text>
    <text x="959" y="180">phrase 2</text>
    <text x="967" y="196">pitch  1.00</text>
    <text x="967" y="212">order  1.00</text>
  </g>
  <text x="959" y="240" font-size="11" fill="#5a6070">no composite score;</text>
  <text x="959" y="256" font-size="11" fill="#5a6070">no tier-3/4 keys</text>

  <!-- legend / notes -->
  <line x1="20" y1="305" x2="1085" y2="305" stroke="#d8dbe2" stroke-width="1"/>
  <g font-size="12.5" fill="#15171c">
    <rect x="20" y="322" width="18" height="12" rx="2" fill="#15171c"/>
    <text x="46" y="333">tiers switched on for this assignment (example: tier 2)</text>
    <rect x="20" y="344" width="18" height="12" rx="2" fill="#ffffff" stroke="#8a90a0" stroke-dasharray="4 3"/>
    <text x="46" y="355">tiers above k: absent from the score vector, not zero, so no later stage can comment on them</text>
    <rect x="20" y="366" width="18" height="12" rx="2" fill="#ffffff" stroke="#b0243b" stroke-width="2"/>
    <text x="46" y="377">the teacher's recording is the reference for every score; its phrases define the windows</text>
  </g>
</svg>
