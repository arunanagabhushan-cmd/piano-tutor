<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 330" width="1100" height="330" font-family="Helvetica, Arial, sans-serif">
<title>The evaluation harness workflow</title>
<desc>The harness commands in order, in five stages: setup, generating and grading attempts, model work, judging, and staging.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#15171c"/></marker><marker id="aA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b0243b"/></marker><marker id="aB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f62b8"/></marker></defs>
<rect width="1100" height="330" fill="#ffffff"/>
<rect x="30" y="40" width="190" height="172" rx="10" fill="#f4f5f7" stroke="#15171c" stroke-width="1.4"/>
<text x="44" y="64" font-size="11.5" fill="#15171c" font-weight="700" text-anchor="start">1 · SETUP</text>
<rect x="42" y="80" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="125.0" y="100" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">doctor</text>
<line x1="125.0" y1="111" x2="125.0" y2="119" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="42" y="120" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="125.0" y="140" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">initdb</text>
<line x1="125.0" y1="151" x2="125.0" y2="159" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="42" y="160" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="125.0" y="180" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">catalog build</text>
<line x1="222" y1="74" x2="240" y2="74" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="242" y="40" width="190" height="172" rx="10" fill="#f4f5f7" stroke="#15171c" stroke-width="1.4"/>
<text x="256" y="64" font-size="11.5" fill="#15171c" font-weight="700" text-anchor="start">2 · GENERATE AND GRADE</text>
<rect x="254" y="80" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="337.0" y="100" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">run-cohort</text>
<line x1="337.0" y1="111" x2="337.0" y2="119" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="254" y="120" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="337.0" y="140" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">groundtruth</text>
<line x1="337.0" y1="151" x2="337.0" y2="159" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="254" y="160" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="337.0" y="180" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">store</text>
<line x1="434" y1="74" x2="452" y2="74" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="454" y="40" width="190" height="252" rx="10" fill="#f4f5f7" stroke="#2f62b8" stroke-width="1.4"/>
<text x="468" y="64" font-size="11.5" fill="#2f62b8" font-weight="700" text-anchor="start">3 · MODELS</text>
<rect x="466" y="80" width="166" height="30" rx="6" fill="#ffffff" stroke="#2f62b8" stroke-width="1.2"/>
<text x="549.0" y="100" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">infer</text>
<line x1="549.0" y1="111" x2="549.0" y2="119" stroke="#2f62b8" stroke-width="1.6" marker-end="url(#aB)"/>
<rect x="466" y="120" width="166" height="30" rx="6" fill="#ffffff" stroke="#2f62b8" stroke-width="1.2"/>
<text x="549.0" y="140" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">report</text>
<line x1="549.0" y1="151" x2="549.0" y2="159" stroke="#2f62b8" stroke-width="1.6" marker-end="url(#aB)"/>
<rect x="466" y="160" width="166" height="30" rx="6" fill="#ffffff" stroke="#2f62b8" stroke-width="1.2"/>
<text x="549.0" y="180" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">export</text>
<line x1="549.0" y1="191" x2="549.0" y2="199" stroke="#2f62b8" stroke-width="1.6" marker-end="url(#aB)"/>
<rect x="466" y="200" width="166" height="30" rx="6" fill="#ffffff" stroke="#d8dbe2" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="549.0" y="220" font-size="10.5" fill="#5a6070" font-weight="400" text-anchor="middle">train · merge · quantize · register</text>
<line x1="549.0" y1="231" x2="549.0" y2="239" stroke="#2f62b8" stroke-width="1.6" marker-end="url(#aB)"/>
<rect x="466" y="240" width="166" height="30" rx="6" fill="#ffffff" stroke="#2f62b8" stroke-width="1.2"/>
<text x="549.0" y="260" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">rescore</text>
<line x1="646" y1="74" x2="664" y2="74" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="666" y="40" width="190" height="212" rx="10" fill="#f4f5f7" stroke="#b0243b" stroke-width="1.4"/>
<text x="680" y="64" font-size="11.5" fill="#b0243b" font-weight="700" text-anchor="start">4 · JUDGING</text>
<rect x="678" y="80" width="166" height="30" rx="6" fill="#ffffff" stroke="#b0243b" stroke-width="1.2"/>
<text x="761.0" y="100" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">judge export</text>
<line x1="761.0" y1="111" x2="761.0" y2="119" stroke="#b0243b" stroke-width="1.6" marker-end="url(#aA)"/>
<rect x="678" y="120" width="166" height="30" rx="6" fill="#ffffff" stroke="#d8dbe2" stroke-width="1.2" stroke-dasharray="4 3"/>
<text x="761.0" y="140" font-size="10.5" fill="#5a6070" font-weight="400" text-anchor="middle">⇅ paste into the judge model</text>
<line x1="761.0" y1="151" x2="761.0" y2="159" stroke="#b0243b" stroke-width="1.6" marker-end="url(#aA)"/>
<rect x="678" y="160" width="166" height="30" rx="6" fill="#ffffff" stroke="#b0243b" stroke-width="1.2"/>
<text x="761.0" y="180" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">judge ingest</text>
<line x1="761.0" y1="191" x2="761.0" y2="199" stroke="#b0243b" stroke-width="1.6" marker-end="url(#aA)"/>
<rect x="678" y="200" width="166" height="30" rx="6" fill="#ffffff" stroke="#b0243b" stroke-width="1.2"/>
<text x="761.0" y="220" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">calibrate</text>
<line x1="858" y1="74" x2="876" y2="74" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="878" y="40" width="190" height="132" rx="10" fill="#f4f5f7" stroke="#15171c" stroke-width="1.4"/>
<text x="892" y="64" font-size="11.5" fill="#15171c" font-weight="700" text-anchor="start">5 · STAGING</text>
<rect x="890" y="80" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="973.0" y="100" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">clone-prod</text>
<line x1="973.0" y1="111" x2="973.0" y2="119" stroke="#15171c" stroke-width="1.6" marker-end="url(#a)"/>
<rect x="890" y="120" width="166" height="30" rx="6" fill="#ffffff" stroke="#15171c" stroke-width="1.2"/>
<text x="973.0" y="140" font-size="12.5" fill="#15171c" font-weight="700" text-anchor="middle">promote</text>
<text x="30" y="314" font-size="11.5" fill="#5a6070" font-weight="400" text-anchor="start" font-style="italic">Every command reads and writes only the harness’s own _eval databases; promote copies a run into a staging replica of the app, and is a dry run unless executed.</text>
</svg>