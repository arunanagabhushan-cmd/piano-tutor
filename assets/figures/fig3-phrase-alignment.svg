<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="960" height="400" font-family="Helvetica, Arial, sans-serif">
<title>Figure 4b. Alignment restarts at each phrase, so errors do not cascade</title>
<desc>The teacher's two phrases are separated by a rest. The student plays more slowly and adds an extra note in phrase 1. The teacher's phrase windows are projected onto the student's timeline, which follows the student's own tempo, so phrase 2 is matched cleanly despite the error in phrase 1.</desc>
