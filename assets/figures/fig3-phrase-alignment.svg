<line x1="144" y1="306" x2="920" y2="306" stroke="#5a6070"/>
<text x="920.0" y="322.0" font-size="11" fill="#5a6070" font-weight="400" text-anchor="end">time →</text>
<text x="30.0" y="380.0" font-size="12.5" fill="#5a6070" font-weight="400" text-anchor="start" font-style="italic">Phrase windows come from the teacher's rests and are projected onto the student's timeline by a fitted tempo line, so a slower</text>
<text x="30.0" y="396.0" font-size="12.5" fill="#5a6070" font-weight="400" text-anchor="start" font-style="italic">student keeps every note. Matching then restarts inside each window.</text>
